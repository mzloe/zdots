general {
    lock_cmd = pidof hyprlock || hyprlock       # avoid starting hyprlock twice
    before_sleep_cmd = loginctl lock-session    # lock before suspend / lid close
    after_sleep_cmd = hyprctl dispatch dpms on  # wake the screen without a key press
}

listener {
    timeout = 300                               # 5 min: lock
    on-timeout = loginctl lock-session
}

listener {
    timeout = 600                               # 10 min: screen off
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

listener {
    timeout = 1800                              # 30 min: suspend
    on-timeout = systemctl suspend
}
